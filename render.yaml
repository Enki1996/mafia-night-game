services:
  - type: web
    name: mafia-nights-online
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAFIA_DATA_DIR
        value: /var/data
    disk:
      name: mafia-rooms
      mountPath: /var/data
      sizeGB: 1
